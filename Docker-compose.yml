# Local Postgres with the pgvector extension (used later for code search).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
      POSTGRES_DB: repomind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: